<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HNG Stage 1 - Contact Us</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card-wrapper">
      <nav class="nav-bar" data-testid="page-navigation">
        <a href="index.html" class="nav-link" data-testid="nav-home-button"
          >Home (Profile)</a
        >
        <a
          href="./contact.html"
          class="nav-link active"
          data-testid="nav-contact-button"
          >Contact Us</a
        >
        <a href="./about.html" class="nav-link" data-testid="nav-about-button"
          >About Me</a
        >
      </nav>

      <section class="page-container" data-testid="contact-form-container">
        <h2 class="page-heading">Get In Touch</h2>

        <form id="contact-form" novalidate>
          <!-- Full Name Field -->
          <div class="form-group">
            <label for="contact-name">Full Name *</label>
            <input
              type="text"
              id="contact-name"
              data-testid="test-contact-name"
              required
              aria-describedby="error-name"
            />
            <div
              id="error-name"
              data-testid="test-contact-error-name"
              class="error-message"
              aria-live="assertive"
            >
              Full Name is required.
            </div>
          </div>

          <!-- Email Field -->
          <div class="form-group">
            <label for="contact-email">Email *</label>
            <input
              type="email"
              id="contact-email"
              data-testid="test-contact-email"
              required
              aria-describedby="error-email"
            />
            <div
              id="error-email"
              data-testid="test-contact-error-email"
              class="error-message"
              aria-live="assertive"
            >
              A valid email is required.
            </div>
          </div>

          <!-- Subject Field -->
          <div class="form-group">
            <label for="contact-subject">Subject *</label>
            <input
              type="text"
              id="contact-subject"
              data-testid="test-contact-subject"
              required
              aria-describedby="error-subject"
            />
            <div
              id="error-subject"
              data-testid="test-contact-error-subject"
              class="error-message"
              aria-live="assertive"
            >
              Subject is required.
            </div>
          </div>

          <!-- Message Field -->
          <div class="form-group">
            <label for="contact-message">Message *</label>
            <textarea
              id="contact-message"
              data-testid="test-contact-message"
              required
              aria-describedby="error-message-length"
            ></textarea>
            <div
              id="error-message-length"
              data-testid="test-contact-error-message"
              class="error-message"
              aria-live="assertive"
            >
              Message must be at least 10 characters long.
            </div>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            data-testid="test-contact-submit"
            class="submit-button"
          >
            Send Message
          </button>

          <!-- Success Message -->
          <div
            id="success-message"
            data-testid="test-contact-success"
            class="success-message"
            style="display: none"
            aria-live="polite"
          >
            Thank you! Your message has been sent successfully.
          </div>
        </form>
      </section>
    </div>
    <script src="script.js"></script>
  </body>
</html>
